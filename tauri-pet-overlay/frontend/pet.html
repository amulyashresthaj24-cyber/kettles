<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowmate Pet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./pet.css?v=1.2" />
  </head>
  <body>
    <main class="pet-shell" id="shell" data-collapsed="false" data-phase="idle" aria-label="Flowmate timer pet">
      <!-- The mascot's "thought": status, live timer, finished-state actions. -->
      <section id="bubble" class="thought">
        <header class="thought-head">
          <span id="statusDot" class="status-dot" aria-hidden="true"></span>
          <span id="label" class="thought-label">Pomodoro</span>
          <button type="button" id="toggle" class="thought-toggle" aria-label="Collapse timer">
            <span class="chevron" aria-hidden="true"></span>
          </button>
        </header>
        <p id="detail" class="thought-timer" aria-live="polite">00:00:00</p>
        <p id="source" class="thought-task">Ready to focus</p>
        <div id="actions" class="thought-actions" hidden>
          <button type="button" id="actionOpen" class="t-btn t-btn-primary">Open</button>
          <button type="button" id="actionDismiss" class="t-btn">Dismiss</button>
        </div>
        <!-- Shrinking trail of dots linking the thought to the mascot. -->
        <div class="thought-trail" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </section>

      <!-- Mascot sprite. Click toggles the thought, double-click opens the app. -->
      <div id="pet" class="pet" aria-hidden="true"></div>

      <!-- Collapsed dropdown handle — colored by phase, click to reopen. -->
      <button type="button" id="indicator" class="pet-indicator" aria-label="Show timer"></button>
    </main>
    <script src="./pet.js?v=1.2"></script>
  </body>
</html>
