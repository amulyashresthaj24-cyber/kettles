<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowmate Pet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./pet.css?v=1.1" />
  </head>
  <body>
    <main id="shell" class="shell" data-phase="idle" data-collapsed="false">
      <!-- Thought bubble = the mascot "thinking" about the timer. -->
      <section id="bubble" class="bubble">
        <header class="bubble-head">
          <span id="dot" class="dot" aria-hidden="true"></span>
          <span id="label" class="label">Focus</span>
          <button type="button" id="collapse" class="collapse" aria-label="Collapse">
            <span class="chev" aria-hidden="true"></span>
          </button>
        </header>
        <p id="timer" class="timer" aria-live="polite">00:00:00</p>
        <p id="task" class="task">Ready to focus</p>
        <div id="controls" class="controls" hidden>
          <button type="button" id="toggle" class="btn btn-primary" data-act="play">
            <span class="ico" aria-hidden="true"></span>
            <span id="toggleLabel">Play</span>
          </button>
          <button type="button" id="complete" class="btn" title="Complete Session">Done</button>
          <button type="button" id="confirm" class="btn btn-primary" title="Save Session">Save</button>
          <button type="button" id="discard" class="btn" title="Discard Session">Discard</button>
          <button type="button" id="open" class="btn" title="Open Flowmate">Open</button>
        </div>
      </section>

      <!-- Thought trail (shrinking dots) linking the bubble to the mascot's head. -->
      <div id="trail" class="trail" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <!-- Animated mascot sprite. Tap to expand when collapsed / open the app. -->
      <div id="mascot" class="mascot" aria-hidden="true"></div>

      <!-- Reopen handle, shown only while collapsed. -->
      <button type="button" id="reopen" class="reopen" aria-label="Show timer">
        <span class="chev down" aria-hidden="true"></span>
      </button>
    </main>
    <script src="./pet.js?v=1.1"></script>
  </body>
</html>
